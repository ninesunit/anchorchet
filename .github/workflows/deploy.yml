# Deploys Anchorchet to Firebase Hosting.
#
# This exists so the app can be shipped without a terminal — the Firebase CLI
# needs an interactive browser login, which is awkward from a phone. Pushing to
# main deploys automatically; "Run workflow" deploys any branch on demand.
#
# One-time setup: add a repository secret named FIREBASE_SERVICE_ACCOUNT
# containing the whole JSON from
#   Firebase console -> Project settings -> Service accounts
#   -> Generate new private key
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race each other to the same live channel.
concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Write service account key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is not set. See the comment at the top of this file."
            exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"

      - name: Deploy hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@14 deploy --only hosting --project anchorchet --non-interactive

      # Advisory, not gating. Before deploying rules the CLI checks that the
      # Firestore API is enabled, and that check needs serviceusage.services.get
      # — a permission the service account Firebase generates does NOT have, so
      # it 403s before reaching the rules themselves. Rules are published from
      # the console instead, and a hosting deploy must not go red over it.
      #
      # To make this step actually work: Google Cloud console -> IAM -> find the
      # firebase-adminsdk service account -> grant "Service Usage Consumer".
      # It starts deploying rules on the next run, no workflow change needed.
      - name: Deploy Firestore rules (advisory)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          if npx --yes firebase-tools@14 deploy --only firestore:rules \
               --project anchorchet --non-interactive; then
            echo "Firestore rules deployed from firestore.rules."
          else
            echo "::warning title=Firestore rules not deployed::firestore.rules was NOT pushed \
          (the service account lacks Service Usage Consumer). If you edited firestore.rules in this \
          commit, publish it by hand: Firebase console -> Firestore Database -> Rules -> paste -> Publish."
          fi

      - name: Clean up credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
